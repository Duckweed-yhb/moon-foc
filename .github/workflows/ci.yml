name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: moon fmt --check
        run: moon fmt --check

  build-and-test:
    name: check & test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本包不使用 C FFI，三个目标的行为应当一致；逐个跑是为了让
        # 「跨后端可用」成为构建期可验证的事实，而不是 README 里的一句声明。
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Check (deny warnings)
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: Build
        run: moon build --target ${{ matrix.target }}

      - name: Test
        run: moon test --target ${{ matrix.target }}

  example:
    name: run example (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Run examples/demo
        run: moon run examples/demo --target native
      # 波形报告：七段式序列是否还是「对称、三相互补、扇区正确」。
      # 它同时是一条便宜的快照——序列映射改了这里会先变。
      - name: Run examples/waveform
        run: moon run examples/waveform --target native

  release-meta:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # moon.mod 的 version、CHANGELOG 最新段标题、README 的安装版本三处必须一致。
      # 发布时漏改任何一处都不会报错，只会让文档变成谎话——用脚本挡在这里。
      - name: Check version / CHANGELOG / README consistency
        shell: pwsh
        run: ./scripts/check-release.ps1
